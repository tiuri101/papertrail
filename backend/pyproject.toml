[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["data*", "migrations*", "tests*"]
namespaces = true

[project]
name = "papertrail-backend"
version = "0.1.0"
description = "FastAPI backend for Papertrail"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.18,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "argon2-cffi>=25,<26",
  "cryptography>=44,<47",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "xlsxwriter>=3.2,<4",
  "pyarrow>=20,<23",
  "rapidfuzz>=3.14,<4",
  "pypdf>=6.0,<7"
]

[project.scripts]
papertrail = "app.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
  "pip-tools>=7.6,<8",
  "types-openpyxl>=3.1,<4"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "UP047"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
exclude = ["^tests/", "^migrations/"]
