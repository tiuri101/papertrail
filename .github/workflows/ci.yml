name: CI

on:
  push:
    branches:
      - main
    tags:
      - "20[0-9][0-9].[0-9][0-9].*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: papertrail_test
          POSTGRES_USER: papertrail
          POSTGRES_PASSWORD: papertrail-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U papertrail -d papertrail_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PAPERTRAIL_ENV: test
      PAPERTRAIL_DATABASE_URL: postgresql+psycopg://papertrail:papertrail-test@127.0.0.1:5432/papertrail_test
      PAPERTRAIL_TEST_DATABASE_URL: postgresql+psycopg://papertrail:papertrail-test@127.0.0.1:5432/papertrail_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: pip install -e 'backend[dev]'

      - name: Run backend tests
        working-directory: backend
        run: pytest

      - name: Run Ruff
        working-directory: backend
        run: ruff check .

      - name: Run quality audit
        run: python scripts/quality_audit.py

      - name: Validate PostgreSQL migrations
        working-directory: backend
        run: alembic upgrade head

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest

    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Run TypeScript checks
        working-directory: frontend
        run: npm run typecheck

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  version:
    name: Determine version
    runs-on: ubuntu-latest

    if: github.event_name == 'push'

    outputs:
      value: ${{ steps.version.outputs.value }}
      is_release: ${{ steps.version.outputs.is_release }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine app version
        id: version
        shell: bash
        run: |
          # Merging to main auto-derives the next CalVer (YEAR.MONTH.PATCH) release
          # version. Pushing a pre-existing tag (e.g. a manual hotfix tag) is still
          # honored as-is so an out-of-band release remains possible.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            YEAR_MONTH=$(date +%Y.%m)
            LAST_PATCH=$(git tag -l "${YEAR_MONTH}.*" | sed -E "s/^${YEAR_MONTH}\.//" | sort -n | tail -1)
            if [ -z "$LAST_PATCH" ]; then
              NEXT_PATCH=1
            else
              NEXT_PATCH=$((10#$LAST_PATCH + 1))
            fi
            VERSION=$(printf '%s.%02d' "$YEAR_MONTH" "$NEXT_PATCH")
            echo "value=$VERSION" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  docker-images:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest

    needs:
      - version

    if: github.event_name == 'push'

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: tiuri101/papertrail-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile

          - name: frontend
            image: tiuri101/papertrail-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

    env:
      PUSH_IMAGE: ${{ needs.version.outputs.is_release == 'true' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          username: tiuri101
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ needs.version.outputs.is_release == 'true' }}
            type=raw,value=${{ needs.version.outputs.value }},enable=${{ needs.version.outputs.is_release == 'true' }}

      - name: Build and optionally push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.version.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest

    needs:
      - version
      - docker-images

    if: github.event_name == 'push' && needs.version.outputs.is_release == 'true'

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.value }}
          generate_release_notes: true
