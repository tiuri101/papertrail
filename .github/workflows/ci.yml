jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: papertrail_test
          POSTGRES_USER: papertrail
          POSTGRES_PASSWORD: papertrail-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U papertrail -d papertrail_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PAPERTRAIL_ENV: test
      PAPERTRAIL_DATABASE_URL: postgresql+psycopg://papertrail:papertrail-test@127.0.0.1:5432/papertrail_test
      PAPERTRAIL_TEST_DATABASE_URL: postgresql+psycopg://papertrail:papertrail-test@127.0.0.1:5432/papertrail_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e 'backend[dev]'
      - run: cd backend && pytest
      - run: cd backend && ruff check .
      - run: python scripts/quality_audit.py
      - name: Validate PostgreSQL migrations
        run: cd backend && alembic upgrade head