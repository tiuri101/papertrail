name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: papertrail_test
          POSTGRES_USER: papertrail
          POSTGRES_PASSWORD: papertrail-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U papertrail -d papertrail_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PAPERTRAIL_ENV: test
      PAPERTRAIL_DATABASE_URL: postgresql+psycopg://papertrail:papertrail-test@127.0.0.1:5432/papertrail_test
      PAPERTRAIL_TEST_DATABASE_URL: postgresql+psycopg://papertrail:papertrail-test@127.0.0.1:5432/papertrail_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: pip install -e 'backend[dev]'

      - name: Run backend tests
        working-directory: backend
        run: pytest

      - name: Run Ruff
        working-directory: backend
        run: ruff check .

      - name: Run quality audit
        run: python scripts/quality_audit.py

      - name: Validate PostgreSQL migrations
        working-directory: backend
        run: alembic upgrade head

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Run TypeScript checks
        working-directory: frontend
        run: npm run typecheck

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  docker-images:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: tiuri101/papertrail-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile

          - name: frontend
            image: tiuri101/papertrail-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

    env:
      PUSH_IMAGE: >-
        ${{ github.event_name == 'push' &&
        (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
        startsWith(github.ref, 'refs/tags/v')) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          username: tiuri101
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ env.PUSH_IMAGE == 'true' }}

      - name: Build and optionally push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
