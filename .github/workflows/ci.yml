name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: papertrail_test
          POSTGRES_USER: papertrail
          POSTGRES_PASSWORD: papertrail-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U papertrail -d papertrail_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PAPERTRAIL_ENV: test
      PAPERTRAIL_DATABASE_URL: postgresql+psycopg://papertrail:papertrail-test@127.0.0.1:5432/papertrail_test
      PAPERTRAIL_TEST_DATABASE_URL: postgresql+psycopg://papertrail:papertrail-test@127.0.0.1:5432/papertrail_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e 'backend[dev]'
      - run: cd backend && pytest
      - run: cd backend && ruff check .
      - run: python scripts/quality_audit.py
      - name: Validate PostgreSQL migrations
        run: cd backend && alembic upgrade head

  docker-images:
    name: Build container — ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: tiuri101/papertrail-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile

          - name: frontend
            image: tiuri101/papertrail-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

    env:
      PUSH_IMAGE: ${{ github.event_name == 'push' && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/v')) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          username: tiuri101
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and optionally push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ env.PUSH_IMAGE == 'true' }}
          load: ${{ env.PUSH_IMAGE != 'true' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
