name: papertrail

# Shared, non-secret operational settings common to every backend process.
# PAPERTRAIL_DATABASE_URL here uses the least-privilege runtime role (DML
# only, no schema/DDL rights) -- this is what the API and the workers
# actually run as. The `migrate` service below overrides it to the
# schema-owning identity instead, and is the only service that also receives
# PAPERTRAIL_ADMIN_PASSWORD and the raw runtime-role credentials needed to
# provision that role in the first place. See docs/operations/security.md.
x-backend-environment: &backend-environment
  PAPERTRAIL_ENV: ${PAPERTRAIL_ENV:-production}
  PAPERTRAIL_DATABASE_URL: postgresql+psycopg://${PAPERTRAIL_RUNTIME_DATABASE_ROLE:?PAPERTRAIL_RUNTIME_DATABASE_ROLE is required}:${PAPERTRAIL_RUNTIME_DATABASE_PASSWORD:?PAPERTRAIL_RUNTIME_DATABASE_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-papertrail}
  PAPERTRAIL_IMPORT_DIR: /data/imports
  PAPERTRAIL_EXPORT_DIR: /data/exports
  PAPERTRAIL_PDF_STORAGE_PATH: /pdf-data
  PAPERTRAIL_MAX_PDF_SIZE_MB: ${PAPERTRAIL_MAX_PDF_SIZE_MB:-50}
  PAPERTRAIL_SESSION_COOKIE_SECURE: ${PAPERTRAIL_SESSION_COOKIE_SECURE:-false}
  PAPERTRAIL_ALLOWED_HOSTS: ${PAPERTRAIL_ALLOWED_HOSTS:-localhost,127.0.0.1}
  PAPERTRAIL_ALLOW_INSECURE_PRODUCTION: ${PAPERTRAIL_ALLOW_INSECURE_PRODUCTION:-false}
  PAPERTRAIL_API_DOCS_ENABLED: ${PAPERTRAIL_API_DOCS_ENABLED:-}
  PAPERTRAIL_PASSWORD_RESET_TTL_MINUTES: ${PAPERTRAIL_PASSWORD_RESET_TTL_MINUTES:-60}
  PAPERTRAIL_PASSWORD_RESET_MAX_ATTEMPTS: ${PAPERTRAIL_PASSWORD_RESET_MAX_ATTEMPTS:-5}
  PAPERTRAIL_CORS_ORIGINS: ${PAPERTRAIL_CORS_ORIGINS:-http://localhost}
  PAPERTRAIL_WORKER_THREADS: ${PAPERTRAIL_WORKER_THREADS:-4}
  PAPERTRAIL_JOB_POLL_INTERVAL_SECONDS: ${PAPERTRAIL_JOB_POLL_INTERVAL_SECONDS:-1}
  PAPERTRAIL_JOB_LEASE_SECONDS: ${PAPERTRAIL_JOB_LEASE_SECONDS:-300}
  PAPERTRAIL_BROWSER_AGENT_PAIRING_TTL_MINUTES: ${PAPERTRAIL_BROWSER_AGENT_PAIRING_TTL_MINUTES:-10}
  PAPERTRAIL_BROWSER_RETRIEVAL_LEASE_SECONDS: ${PAPERTRAIL_BROWSER_RETRIEVAL_LEASE_SECONDS:-300}
  PAPERTRAIL_EMAIL_ENABLED: ${PAPERTRAIL_EMAIL_ENABLED:-false}
  PAPERTRAIL_PUBLIC_BASE_URL: ${PAPERTRAIL_PUBLIC_BASE_URL:-http://localhost}
  PAPERTRAIL_NOTIFICATION_ENCRYPTION_KEY: ${PAPERTRAIL_NOTIFICATION_ENCRYPTION_KEY:-}
  PAPERTRAIL_SMTP_HOST: ${PAPERTRAIL_SMTP_HOST:-}
  PAPERTRAIL_SMTP_PORT: ${PAPERTRAIL_SMTP_PORT:-587}
  PAPERTRAIL_SMTP_USERNAME: ${PAPERTRAIL_SMTP_USERNAME:-}
  PAPERTRAIL_SMTP_PASSWORD: ${PAPERTRAIL_SMTP_PASSWORD:-}
  PAPERTRAIL_SMTP_FROM_ADDRESS: ${PAPERTRAIL_SMTP_FROM_ADDRESS:-}
  PAPERTRAIL_SMTP_STARTTLS: ${PAPERTRAIL_SMTP_STARTTLS:-true}
  PAPERTRAIL_SMTP_USE_SSL: ${PAPERTRAIL_SMTP_USE_SSL:-false}
  PAPERTRAIL_SMTP_TIMEOUT_SECONDS: ${PAPERTRAIL_SMTP_TIMEOUT_SECONDS:-30}
  PAPERTRAIL_LLM_ENABLED: ${PAPERTRAIL_LLM_ENABLED:-false}
  PAPERTRAIL_OLLAMA_BASE_URL: ${PAPERTRAIL_OLLAMA_BASE_URL:-}
  PAPERTRAIL_OLLAMA_MODEL: ${PAPERTRAIL_OLLAMA_MODEL:-}
  PAPERTRAIL_OLLAMA_REQUEST_TIMEOUT_SECONDS: ${PAPERTRAIL_OLLAMA_REQUEST_TIMEOUT_SECONDS:-300}
  PAPERTRAIL_OLLAMA_API_KEY: ${PAPERTRAIL_OLLAMA_API_KEY:-}
  PAPERTRAIL_LLM_MAX_CONCURRENT_JOBS: ${PAPERTRAIL_LLM_MAX_CONCURRENT_JOBS:-1}
  PAPERTRAIL_LLM_CONTEXT_LENGTH: ${PAPERTRAIL_LLM_CONTEXT_LENGTH:-32768}
  PAPERTRAIL_LLM_MAX_EVIDENCE_ITEMS: ${PAPERTRAIL_LLM_MAX_EVIDENCE_ITEMS:-3}
  PAPERTRAIL_LLM_MAX_EVIDENCE_QUOTE_CHARS: ${PAPERTRAIL_LLM_MAX_EVIDENCE_QUOTE_CHARS:-500}

x-backend-hardening: &backend-hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    cap_drop: [ALL]
    # The official entrypoint starts as root and drops to the postgres user
    # itself (and, on first run, chowns the data directory) -- it needs these
    # back even though nothing else does.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 1g
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
      - /dev/shm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-papertrail}
      POSTGRES_USER: ${POSTGRES_USER:-papertrail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-papertrail} -d ${POSTGRES_DB:-papertrail}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: tiuri101/papertrail-backend:${PAPERTRAIL_IMAGE_TAG:?PAPERTRAIL_IMAGE_TAG is required}
    <<: *backend-hardening
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp
    environment:
      <<: *backend-environment
      # The migration/bootstrap identity is the only one that ever sees the
      # schema-owning credentials, the bootstrap admin password, or the raw
      # runtime-role credentials it is about to provision -- see
      # docs/operations/security.md for the full privilege-separation model.
      PAPERTRAIL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-papertrail}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-papertrail}
      PAPERTRAIL_ADMIN_USERNAME: ${PAPERTRAIL_ADMIN_USERNAME:-admin}
      PAPERTRAIL_ADMIN_DISPLAY_NAME: ${PAPERTRAIL_ADMIN_DISPLAY_NAME:-Papertrail Administrator}
      PAPERTRAIL_ADMIN_PASSWORD: ${PAPERTRAIL_ADMIN_PASSWORD:?PAPERTRAIL_ADMIN_PASSWORD is required}
      PAPERTRAIL_RUNTIME_DB_ROLE: ${PAPERTRAIL_RUNTIME_DATABASE_ROLE:?PAPERTRAIL_RUNTIME_DATABASE_ROLE is required}
      PAPERTRAIL_RUNTIME_DB_PASSWORD: ${PAPERTRAIL_RUNTIME_DATABASE_PASSWORD:?PAPERTRAIL_RUNTIME_DATABASE_PASSWORD is required}
    command: >-
      sh -c 'alembic upgrade head &&
             python -m app.cli ensure-runtime-role &&
             python -m app.cli create-admin'
    volumes:
      - papertrail_files:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: tiuri101/papertrail-backend:${PAPERTRAIL_IMAGE_TAG:?PAPERTRAIL_IMAGE_TAG is required}
    restart: unless-stopped
    <<: *backend-hardening
    mem_limit: 1g
    read_only: true
    tmpfs:
      - /tmp
    environment: *backend-environment
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=${PAPERTRAIL_TRUSTED_PROXY_IPS:-127.0.0.1}
    ports:
      # Bound to loopback by default: only a reverse proxy running on this host
      # can reach the API directly. Anyone who could reach a publicly exposed
      # port here could also spoof X-Forwarded-For and bypass login-throttle
      # IP tracking, since --forwarded-allow-ips trusts it. If your reverse
      # proxy runs elsewhere (a different host or container network), set
      # PAPERTRAIL_API_BIND to its reachable address/interface and
      # PAPERTRAIL_TRUSTED_PROXY_IPS to its source IP.
      - "${PAPERTRAIL_API_BIND:-127.0.0.1}:${PAPERTRAIL_API_PORT:-8000}:8000"
    volumes:
      - papertrail_files:/data
      - papertrail_pdf_data:/pdf-data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    image: tiuri101/papertrail-backend:${PAPERTRAIL_IMAGE_TAG:?PAPERTRAIL_IMAGE_TAG is required}
    restart: unless-stopped
    <<: *backend-hardening
    mem_limit: 1g
    read_only: true
    tmpfs:
      - /tmp
    environment: *backend-environment
    command: python -m app.jobs.worker
    volumes:
      - papertrail_files:/data
      - papertrail_pdf_data:/pdf-data
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy

  llm-worker:
    image: tiuri101/papertrail-backend:${PAPERTRAIL_IMAGE_TAG:?PAPERTRAIL_IMAGE_TAG is required}
    restart: unless-stopped
    <<: *backend-hardening
    mem_limit: 1g
    read_only: true
    tmpfs:
      - /tmp
    environment: *backend-environment
    command: python -m app.jobs.worker --llm
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy

  frontend:
    image: tiuri101/papertrail-frontend:${PAPERTRAIL_IMAGE_TAG:?PAPERTRAIL_IMAGE_TAG is required}
    restart: unless-stopped
    cap_drop: [ALL]
    # nginx's master process starts as root and chowns its (tmpfs) cache
    # directories to the unprivileged `nginx` user before forking workers
    # that setuid/setgid down to it -- it needs these three back to do that,
    # even with the image's default container user left untouched.
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    ports:
      # Bound to loopback by default — see the api service's port comment.
      - "${PAPERTRAIL_FRONTEND_BIND:-127.0.0.1}:${PAPERTRAIL_FRONTEND_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s

volumes:
  postgres_data:
    name: papertrail_postgres_data
  papertrail_files:
    name: papertrail_files
  papertrail_pdf_data:
    name: papertrail_pdf_data
