name: papertrail

x-backend-environment: &backend-environment
  PAPERTRAIL_ENV: ${PAPERTRAIL_ENV:-production}
  PAPERTRAIL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-papertrail}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-papertrail}
  PAPERTRAIL_IMPORT_DIR: /data/imports
  PAPERTRAIL_EXPORT_DIR: /data/exports
  PAPERTRAIL_PDF_STORAGE_PATH: /pdf-data
  PAPERTRAIL_MAX_PDF_SIZE_MB: ${PAPERTRAIL_MAX_PDF_SIZE_MB:-50}
  PAPERTRAIL_SESSION_COOKIE_SECURE: ${PAPERTRAIL_SESSION_COOKIE_SECURE:-false}
  PAPERTRAIL_ALLOWED_HOSTS: ${PAPERTRAIL_ALLOWED_HOSTS:-localhost,127.0.0.1}
  PAPERTRAIL_PASSWORD_RESET_TTL_MINUTES: ${PAPERTRAIL_PASSWORD_RESET_TTL_MINUTES:-60}
  PAPERTRAIL_PASSWORD_RESET_MAX_ATTEMPTS: ${PAPERTRAIL_PASSWORD_RESET_MAX_ATTEMPTS:-5}
  PAPERTRAIL_CORS_ORIGINS: ${PAPERTRAIL_CORS_ORIGINS:-http://localhost}
  PAPERTRAIL_WORKER_THREADS: ${PAPERTRAIL_WORKER_THREADS:-4}
  PAPERTRAIL_JOB_POLL_INTERVAL_SECONDS: ${PAPERTRAIL_JOB_POLL_INTERVAL_SECONDS:-1}
  PAPERTRAIL_JOB_LEASE_SECONDS: ${PAPERTRAIL_JOB_LEASE_SECONDS:-300}
  PAPERTRAIL_EMAIL_ENABLED: ${PAPERTRAIL_EMAIL_ENABLED:-false}
  PAPERTRAIL_PUBLIC_BASE_URL: ${PAPERTRAIL_PUBLIC_BASE_URL:-http://localhost}
  PAPERTRAIL_SMTP_HOST: ${PAPERTRAIL_SMTP_HOST:-}
  PAPERTRAIL_SMTP_PORT: ${PAPERTRAIL_SMTP_PORT:-587}
  PAPERTRAIL_SMTP_USERNAME: ${PAPERTRAIL_SMTP_USERNAME:-}
  PAPERTRAIL_SMTP_PASSWORD: ${PAPERTRAIL_SMTP_PASSWORD:-}
  PAPERTRAIL_SMTP_FROM_ADDRESS: ${PAPERTRAIL_SMTP_FROM_ADDRESS:-}
  PAPERTRAIL_SMTP_STARTTLS: ${PAPERTRAIL_SMTP_STARTTLS:-true}
  PAPERTRAIL_SMTP_USE_SSL: ${PAPERTRAIL_SMTP_USE_SSL:-false}
  PAPERTRAIL_SMTP_TIMEOUT_SECONDS: ${PAPERTRAIL_SMTP_TIMEOUT_SECONDS:-30}
  PAPERTRAIL_LLM_ENABLED: ${PAPERTRAIL_LLM_ENABLED:-false}
  PAPERTRAIL_OLLAMA_BASE_URL: ${PAPERTRAIL_OLLAMA_BASE_URL:-}
  PAPERTRAIL_OLLAMA_MODEL: ${PAPERTRAIL_OLLAMA_MODEL:-}
  PAPERTRAIL_OLLAMA_REQUEST_TIMEOUT_SECONDS: ${PAPERTRAIL_OLLAMA_REQUEST_TIMEOUT_SECONDS:-300}
  PAPERTRAIL_OLLAMA_API_KEY: ${PAPERTRAIL_OLLAMA_API_KEY:-}
  PAPERTRAIL_LLM_MAX_CONCURRENT_JOBS: ${PAPERTRAIL_LLM_MAX_CONCURRENT_JOBS:-1}
  PAPERTRAIL_LLM_CONTEXT_LENGTH: ${PAPERTRAIL_LLM_CONTEXT_LENGTH:-32768}
  PAPERTRAIL_LLM_MAX_EVIDENCE_ITEMS: ${PAPERTRAIL_LLM_MAX_EVIDENCE_ITEMS:-3}
  PAPERTRAIL_LLM_MAX_EVIDENCE_QUOTE_CHARS: ${PAPERTRAIL_LLM_MAX_EVIDENCE_QUOTE_CHARS:-500}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-papertrail}
      POSTGRES_USER: ${POSTGRES_USER:-papertrail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-papertrail} -d ${POSTGRES_DB:-papertrail}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: tiuri101/papertrail-backend:${PAPERTRAIL_IMAGE_TAG:?PAPERTRAIL_IMAGE_TAG is required}
    environment: *backend-environment
    command: alembic upgrade head
    volumes:
      - papertrail_files:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: tiuri101/papertrail-backend:${PAPERTRAIL_IMAGE_TAG:?PAPERTRAIL_IMAGE_TAG is required}
    restart: unless-stopped
    environment: *backend-environment
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
    ports:
      - "${PAPERTRAIL_API_PORT:-8000}:8000"
    volumes:
      - papertrail_files:/data
      - papertrail_pdf_data:/pdf-data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    image: tiuri101/papertrail-backend:${PAPERTRAIL_IMAGE_TAG:?PAPERTRAIL_IMAGE_TAG is required}
    restart: unless-stopped
    environment: *backend-environment
    command: python -m app.jobs.worker
    volumes:
      - papertrail_files:/data
      - papertrail_pdf_data:/pdf-data
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy

  llm-worker:
    image: tiuri101/papertrail-backend:${PAPERTRAIL_IMAGE_TAG:?PAPERTRAIL_IMAGE_TAG is required}
    restart: unless-stopped
    environment: *backend-environment
    command: python -m app.jobs.worker --llm
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy

  frontend:
    image: tiuri101/papertrail-frontend:${PAPERTRAIL_IMAGE_TAG:?PAPERTRAIL_IMAGE_TAG is required}
    restart: unless-stopped
    ports:
      - "${PAPERTRAIL_FRONTEND_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
    name: papertrail_postgres_data
  papertrail_files:
    name: papertrail_files
  papertrail_pdf_data:
    name: papertrail_pdf_data
