server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  # script-src hash covers the inline theme-flash-prevention script in index.html
  # (frontend/index.html); regenerate if that script's contents ever change.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-9y0FGCJahvGeHCwOhO2p6mN/ljcd3Y2S8WEk78RFNq4='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  location / {
    try_files $uri /index.html;
  }
}
